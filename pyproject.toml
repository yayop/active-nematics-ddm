[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "active-nematics-ddm"
version = "0.1.0"
description = "Reproducible differential dynamic microscopy for active-nematic microscopy videos"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Edgardo Rosas" }]
keywords = ["active matter", "active nematics", "DDM", "microscopy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
  "matplotlib>=3.8",
  "nd2>=0.10,<0.12",
  "numpy>=1.26",
  "scipy>=1.12",
  "threadpoolctl>=3.4",
  "tifffile>=2024.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]
fast = ["fastddm>=0.3.15"]

[project.scripts]
an-ddm = "active_nematics_ddm.cli:main"

[project.urls]
Repository = "https://github.com/yayop/active-nematics-ddm"
Issues = "https://github.com/yayop/active-nematics-ddm/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
